{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
    .team-page {
        padding: 3rem 0 4rem;
        background: linear-gradient(180deg, #f7faf9 0%, #eef6f5 100%);
    }

    .team-header {
        font-size: clamp(2rem, 3vw, 2.8rem);
        font-weight: 800;
        margin-bottom: 1.5rem;
        text-transform: capitalize;
        line-height: 1.2;
    }

    .team-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin: 0 auto;
    }

    .team-page .container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .team-card {
        background: #fff;
        border: 1px solid rgba(0, 77, 64, 0.08);
        border-radius: 26px;
        overflow: hidden;
        box-shadow: 0 18px 45px rgba(31, 41, 55, 0.1);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        flex: 0 1 620px;
        width: min(100%, 620px);
        text-align: center;
    }

    .team-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 24px 50px rgba(31, 41, 55, 0.14);
    }

    .team-image-wrap {
        width: 100%;
        height: 125px;
        background: linear-gradient(135deg, #f1f5f9, #e8f1ef);
        border-bottom: 1px solid #e8eeec;
    }

    .team-card img {
        width: 190px;
        height: 190px;
        object-fit: cover;
        border-radius: 50%;
        border: 6px solid #fff;
        background: #eef7f6;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
        margin-top: -95px;
    }

    .team-body {
        padding: 0 2rem 2rem;
        text-align: center;
    }

    .team-name {
        font-size: clamp(1.8rem, 3vw, 2.2rem);
        font-weight: 800;
        color: #0f172a;
        margin: 0.8rem 0 0.4rem;
    }

    .team-post {
        font-size: 1.15rem;
        font-weight: 700;
        color: #004D40;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.75rem;
    }

    .team-exp {
        font-size: 1.1rem;
        line-height: 1.6;
        color: #475569;
        margin: 0;
    }

    @media (max-width: 575.98px) {
        .team-body {
            padding: 0 1.25rem 1.5rem;
        }

        .team-card img {
            width: 165px;
            height: 165px;
            margin-top: -82px;
        }

        .team-image-wrap {
            height: 110px;
        }
    }
</style>

<div class="team-page">
    <div class="container">
        <p class="team-header text-center mb-3">Our <b class="text-mycolor1">Team</b></p>

        <div class="team-grid">
            {% for r in tem %}
            <div class="team-card">
                <div class="team-image-wrap"></div>
                <div class="team-body">
                    {% if r.picture %}
                    <img src="/{{r.picture}}" alt="{{r.name}}'s photo" />
                    {% else %}
                    <img src="{% static 'images/user logo.png' %}" alt="Default team photo" />
                    {% endif %}
                    <div class="team-name">{{r.name}}</div>
                    <div class="team-post">{{r.post}}</div>
                    <p class="team-exp">{{r.experience}}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
